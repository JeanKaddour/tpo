[project]
name = "tpo"
version = "0.1.0"
description = "Standalone TPO paper artifact"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax[cuda12]",
    "flax",
    "optax",
    "matplotlib",
    "numpy",
    "wandb",
    "pytest",
]

[dependency-groups]
dev = [
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tpo"]

[tool.mypy]
python_version = "3.10"
files = ["src/tpo", "tests", "scripts"]
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = [
    "nvidia",
    "optax",
    "optax.*",
]
ignore_missing_imports = true
